[project]
name = "docsense"
version = "0.1.0"
description = "RAG-powered Ballerina connector documentation assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.40.0",
    "qdrant-client>=1.12.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "mmh3>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docsense"]
